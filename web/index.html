<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#182b36;background:#f5f5f0}*{box-sizing:border-box}body{margin:0}main{max-width:1060px;margin:auto;padding:70px 28px}header{padding-bottom:40px;border-bottom:2px solid #182b36}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:700;color:#4d6c61}h1{font-size:clamp(42px,8vw,76px);letter-spacing:-.05em;line-height:1.1;margin:20px 0}header p{line-height:1.9;max-width:600px;color:#52616a}ul{padding:0;margin:0;list-style:none}li{display:flex;align-items:center;gap:24px;padding:24px 0;border-bottom:1px solid #d2d8d2}.number{font-variant-numeric:tabular-nums;font-size:13px;color:#63746b}li div{flex:1}h2{font-size:clamp(17px,3vw,23px);margin:0 0 6px}li p{margin:0;color:#68746c;font-size:12px;overflow-wrap:anywhere}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}a:focus-visible{outline:3px solid #228570;outline-offset:5px}.visit{white-space:nowrap;font-size:13px;font-weight:600}.visit span{margin-left:10px}footer{margin-top:40px;font-size:12px;line-height:1.8;color:#637068}footer a{text-decoration:underline}@media(max-width:480px){main{padding:40px 20px}li{gap:14px;flex-wrap:wrap}.visit{margin-left:30px}.number{width:16px}li div{min-width:calc(100% - 32px)}}
